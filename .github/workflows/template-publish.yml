name: template-publish

# 模板包与契约包各有各的版本节奏：契约走 v*，模板走 template-v*。
on:
  push:
    tags: ['template-v*']
  workflow_dispatch:

jobs:
  nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 换 OIDC 令牌（Trusted Publishing）

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^template-v', ''
          $version = dotnet msbuild templates/Hosihikari.Plugin.Template/Hosihikari.Plugin.Template.csproj -getProperty:PackageVersion
          if ($version -ne $tag) { throw "PackageVersion 是 $version，标签是 $tag" }

      - name: 打包
        run: >
          dotnet pack
          templates/Hosihikari.Plugin.Template/Hosihikari.Plugin.Template.csproj
          -c Release -o out

      - name: 换临时 API key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 推送
        run: >
          dotnet nuget push out/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
