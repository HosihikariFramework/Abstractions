name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 版本号的事实源是 csproj 里的 <Version>，标签只是触发器。
      - name: 打包
        run: dotnet pack src/Hosihikari.Abstractions.csproj -c Release -o out

      # 需要仓库 secret NUGET_API_KEY（nuget.org 的 API key）。
      - name: 推送
        run: >
          dotnet nuget push out/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
