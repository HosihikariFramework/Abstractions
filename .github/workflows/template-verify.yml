name: template-verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: Hosihikari.Abstractions

      # 打包器在核心仓；fork 让核心按源码编。
      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginManagement
          path: Hosihikari.PluginManager

      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/Hosihikari.McMaster.NETCore.Plugins
          path: Hosihikari.McMaster.NETCore.Plugins

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 模板引用本仓的契约版本；本地打包并加为源，发布前的版本也能验证。
      - name: 打包契约与模板
        run: |
          set -euo pipefail
          dotnet pack Hosihikari.Abstractions/src/Hosihikari.Abstractions.csproj -c Release -o artifacts
          dotnet pack Hosihikari.Abstractions/templates/Hosihikari.Plugin.Template/Hosihikari.Plugin.Template.csproj -c Release -o artifacts
          dotnet nuget add source "$PWD/artifacts" -n local

      - name: 检查模板包许可
        run: |
          set -euo pipefail
          unzip -p artifacts/Hosihikari.Plugin.Template.*.nupkg Hosihikari.Plugin.Template.nuspec | grep -q 'MIT-0'

      - name: 生成并构建插件
        run: |
          set -euo pipefail
          dotnet new install artifacts/Hosihikari.Plugin.Template.*.nupkg
          dotnet new hosihikari-plugin -n HelloTemplate -o "$RUNNER_TEMP/HelloTemplate"
          test -f "$RUNNER_TEMP/HelloTemplate/LICENSE.md"
          dotnet build "$RUNNER_TEMP/HelloTemplate/HelloTemplate.csproj" -c Release

      - name: 打插件包
        env:
          HOSIHIKARI_PLUGINMANAGER: ${{ github.workspace }}/Hosihikari.PluginManager
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/HelloTemplate"
          bash ./pack.sh
          test -f dist/HelloTemplate/HelloTemplate.dll
          test -f dist/HelloTemplate/manifest.json
          if find dist/HelloTemplate -name 'Hosihikari.Abstractions.dll' | grep -q .; then
            echo 'the shared contract leaked into the plugin package' >&2
            exit 1
          fi

      - name: 清理模板
        if: always()
        run: dotnet new uninstall Hosihikari.Plugin.Template || true
